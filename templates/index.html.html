<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Dictation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0b0c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            /* Красное свечение сзади, как на референсе */
            background-image: radial-gradient(circle at 50% 60%, rgba(185, 12, 22, 0.25) 0%, rgba(11, 11, 12, 1) 70%);
        }
        .card {
            background: rgba(20, 20, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(220, 20, 60, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            font-weight: 400;
            font-size: 22px;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            color: #f1f1f1;
        }
        .lang-select-wrapper {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #888;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background: rgba(30, 30, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        select:focus {
            border-color: #dc143c;
        }
        .audio-btn-container {
            margin: 25px 0;
        }
        .btn-audio {
            background: linear-gradient(135deg, #ff1e38 0%, #b50619 100%);
            color: white;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 28px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(220, 20, 60, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-audio:active {
            transform: scale(0.93);
        }
        .speed-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: #aaa;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .speed-box select {
            width: 110px;
            margin: 0;
            padding: 6px;
            font-size: 14px;
            background: rgba(40, 40, 45, 0.9);
        }
        .input-container {
            position: relative;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px 18px;
            background: rgba(25, 25, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #ff1e38;
        }
        input[type="text"]::placeholder {
            color: #666;
        }
        .btn-primary {
            background: #ffffff;
            color: #0b0b0c;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        #result-box {
            margin-top: 20px;
            text-align: left;
            background: rgba(25, 25, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 14px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            color: #ddd;
        }
        .translation-text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ff8c94;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .correct { color: #2ecc71; font-weight: bold; }
        .extra { color: #e74c3c; text-decoration: line-through; }
        .missing { color: #f1c40f; background: rgba(241, 196, 15, 0.15); padding: 0 2px; border-radius: 3px; }

        .btn-next {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-next:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>AI Диктант</h2>

        <div class="lang-select-wrapper">
            <label for="langSelect">Язык тренировки</label>
            <select id="langSelect" onchange="loadNewPhrase()">
                <option value="it">Итальянский (Italiano)</option>
                <option value="ko">Корейский (한국어)</option>
            </select>
        </div>

        <div class="speed-box">
            <span>Скорость голоса:</span>
            <select id="speedSelect">
                <option value="0.5">0.5x (Медленно)</option>
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x (Норм)</option>
                <option value="1.25">1.25x (Быстро)</option>
            </select>
        </div>

        <!-- Центральная кнопка запуска аудио (в стиле неонового шара) -->
        <div class="audio-btn-container">
            <button class="btn-audio" onclick="playAudio()" title="Прослушать">
                🔊
            </button>
        </div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Напишите услышанное..." autocomplete="off">
        </div>

        <button class="btn-primary" onclick="checkAnswer()">Проверить</button>

        <div id="result-box" style="display: none;"></div>

        <button class="btn-primary btn-next" id="nextBtn" style="display: none;" onclick="loadNewPhrase()">Следующая фраза ➡️</button>
    </div>

    <script>
        let currentPhraseText = "";
        let currentIndex = 0;

        window.onload = function() {
            loadNewPhrase();
        };

        function loadNewPhrase() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('userInput').value = "";
            document.getElementById('result-box').style.display = "none";
            document.getElementById('nextBtn').style.display = "none";

            fetch('/get_phrase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lang: lang, index: currentIndex })
            })
            .then(res => res.json())
            .then(data => {
                currentPhraseText = data.phrase;
                currentIndex = data.index;
            });
        }

        function playAudio() {
            if (!currentPhraseText) return;

            window.speechSynthesis.cancel();

            const lang = document.getElementById('langSelect').value;
            const speed = parseFloat(document.getElementById('speedSelect').value);

            const utterance = new SpeechSynthesisUtterance(currentPhraseText);
            utterance.lang = lang === 'it' ? 'it-IT' : 'ko-KR';
            utterance.rate = speed;

            window.speechSynthesis.speak(utterance);
        }

        function checkAnswer() {
            const lang = document.getElementById('langSelect').value;
            const userTextClean = document.getElementById('userInput').value;

            fetch('/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lang: lang, index: currentIndex, text: userTextClean })
            })
            .then(res => res.json())
            .then(data => {
                const resultBox = document.getElementById('result-box');
                resultBox.style.display = "block";

                let html = "";
                if (data.is_perfect) {
                    html = "<span class='correct'>🎉 Идеально! Написано абсолютно верно.</span><br>";
                } else {
                    html = "<b>Результат проверки:</b><br>";
                    data.comparison.forEach(item => {
                        if (item.status === 'correct') {
                            html += `<span class="correct">${item.char}</span>`;
                        } else if (item.status === 'extra') {
                            html += `<span class="extra">${item.char}</span>`;
                        } else if (item.status === 'missing') {
                            html += `<span class="missing">${item.char}</span>`;
                        }
                    });
                    html += `<br><br><b>Правильный вариант:</b><br>${data.original}`;
                }

                html += `<div class="translation-text">🇷🇺 <b>Перевод:</b> ${data.translation}</div>`;

                resultBox.innerHTML = html;
                currentIndex++;
                document.getElementById('nextBtn').style.display = "block";
            });
        }
    </script>
</body>
</html>
